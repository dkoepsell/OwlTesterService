<title>Kindwork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a workbench. Wordmark and step tabs on top, then one working surface per step.
   Interview is list + detail; Build is a live preview of the generated tool beside its files. */
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --sunk:#E9EDE9; --ink:#15201A; --ink-2:#4F5C55; --ink-3:#77837D; --line:#D3DAD4;
  --accent:#15201A; --accent-ink:#F7F9F6; --focus:#2F62B8;
  --time:#8A570A; --time-soft:#F6ECDA; --rec:#13675A; --rec-soft:#DCEFE9; --thg:#3B587A; --thg-soft:#E2E9F2;
  --crit:#B42318; --crit-soft:#FBE8E6; --warn:#8F5E00; --warn-soft:#FAF0D9; --chain:#6740A6; --chain-soft:#EFE8F9; --good:#1F6C46; --good-soft:#E0F1E7;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1411; --surface:#151D19; --sunk:#1B2420; --ink:#E4EBE6; --ink-2:#A7B4AD; --ink-3:#7D8A83; --line:#2A3530;
  --accent:#E4EBE6; --accent-ink:#0E1411; --focus:#7FA8F0;
  --time:#E3B462; --time-soft:#2D2311; --rec:#62C7B1; --rec-soft:#11302A; --thg:#97B5DA; --thg-soft:#1A2533;
  --crit:#F28A80; --crit-soft:#3A1714; --warn:#E6B65E; --warn-soft:#32260F; --chain:#B99DF2; --chain-soft:#261C3A; --good:#76D19F; --good-soft:#13301F;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0E1411; --surface:#151D19; --sunk:#1B2420; --ink:#E4EBE6; --ink-2:#A7B4AD; --ink-3:#7D8A83; --line:#2A3530;
  --accent:#E4EBE6; --accent-ink:#0E1411; --focus:#7FA8F0;
  --time:#E3B462; --time-soft:#2D2311; --rec:#62C7B1; --rec-soft:#11302A; --thg:#97B5DA; --thg-soft:#1A2533;
  --crit:#F28A80; --crit-soft:#3A1714; --warn:#E6B65E; --warn-soft:#32260F; --chain:#B99DF2; --chain-soft:#261C3A; --good:#76D19F; --good-soft:#13301F;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.shell{max-width:1200px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.mark{font:700 clamp(30px,4.4vw,44px)/1 var(--display);letter-spacing:-.025em}
.mark span{color:var(--rec)}
.tag{margin:8px 0 0;color:var(--ink-2);max-width:60ch;text-wrap:pretty}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked + .track{background:var(--rec)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--focus);outline-offset:2px}

.steps{display:flex;gap:6px;margin:18px 0 22px;overflow-x:auto;padding-bottom:2px}
.step{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:14.5px;padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.step:hover{color:var(--ink)}
.step[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step .n{font:600 12px var(--mono);opacity:.65}
.count{font:600 11.5px var(--mono);padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--ink-2);font-variant-numeric:tabular-nums}
.step[aria-selected="true"] .count{background:color-mix(in srgb,var(--paper) 18%,transparent);color:var(--paper)}
.count.alert{background:var(--crit-soft);color:var(--crit)}

h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
.eyebrow{font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:14px;margin:4px 0 0}
.lab{display:block;font-weight:700;font-size:14px;margin-bottom:6px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;padding:9px 15px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:2px 2px;color:var(--ink);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

input[type=text],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ink-3)}

.kw{display:inline-flex;align-items:center;font:600 12.5px/1 var(--mono);padding:5px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.kw.big{font-size:17px;padding:8px 14px}
.kw.fam-time{color:var(--time);background:var(--time-soft);border-color:color-mix(in srgb,var(--time) 30%,transparent)}
.kw.fam-records{color:var(--rec);background:var(--rec-soft);border-color:color-mix(in srgb,var(--rec) 30%,transparent)}
.kw.fam-things{color:var(--thg);background:var(--thg-soft);border-color:color-mix(in srgb,var(--thg) 30%,transparent)}
.kw.rec{box-shadow:0 0 0 2px var(--surface),0 0 0 3px currentColor}
.pill{display:inline-flex;font:600 11.5px/1 var(--mono);padding:5px 8px;border-radius:99px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ontline{font:12.5px/1.45 var(--mono);color:var(--ink-2);margin:8px 0 0}
.ontline code{font:inherit;color:var(--ink)}

/* Describe */
.describe{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.describe textarea{min-height:220px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.status{font-size:14px;color:var(--ink-2)}
.status.busy::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);margin-right:8px;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.addrow{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.how ol{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.how li{display:grid;grid-template-columns:30px 1fr;gap:10px}
.how .num{font:600 13px var(--mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.how p{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* Interview */
.iv{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.tl-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
.titem{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer}
.titem:hover{background:var(--sunk)}
.titem.on{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.tname{font-weight:700;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.tmeta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{font:600 11px/1 var(--mono);min-width:19px;height:19px;padding:0 5px;border-radius:99px;display:grid;place-items:center;background:var(--crit);color:#fff}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:20px;min-width:0}
.tname-in{font:700 22px/1.2 var(--display)!important;padding:8px 11px}
.fields{display:grid;gap:4px}
.fields .lab:not(:first-child){margin-top:10px}
.flag{background:var(--crit-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14.5px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.qs{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.q{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px}
.q.open{border-color:var(--ink-3);background:var(--sunk)}
.qn{font:600 12px var(--mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.qt{margin:0;font-weight:700;font-size:15px;line-height:1.4}
.qh{margin:4px 0 10px;font-size:13.5px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[data-v="?"][aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.unsure{margin:10px 0 0;font-size:14px;background:var(--warn-soft);padding:8px 11px;border-radius:8px}
.side{display:flex;flex-direction:column;gap:16px}
.result{border-radius:12px;padding:16px;border:1px solid var(--line)}
.result.fam-time{background:var(--time-soft)}
.result.fam-records{background:var(--rec-soft)}
.result.fam-things{background:var(--thg-soft)}
.result.pending{background:var(--sunk);border-style:dashed}
.result .kwrow{margin:10px 0 8px}
.result p{margin:0;font-size:14.5px}
.block h3{margin-bottom:2px}
.slots{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.slab{display:block;font-weight:700;font-size:13.5px;margin-bottom:5px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14.5px}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;margin-top:10px}
.sig{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.sig input,.check input{margin-top:4px;accent-color:var(--rec)}
.dfoot{display:flex;gap:10px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--line)}

/* Resolve */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rhead p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sev{font:600 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sev-partition .card-head{background:var(--crit-soft)} .sev-partition .sev{color:var(--crit)}
.sev-within .card-head{background:var(--warn-soft)} .sev-within .sev{color:var(--warn)}
.sev-chain .card-head{background:var(--chain-soft)} .sev-chain .sev{color:var(--chain)}
.card-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-body p{margin:0;font-size:15px}
.card-body .ontline{margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.optform{display:flex;gap:8px;width:100%}
.optform input{flex:1;min-width:0}
.quiet{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--ink-2)}
.quiet h3{color:var(--ink);margin-bottom:6px}
.undecided{margin-top:24px}
.undecided ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}

/* Build */
.bhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:18px}
.bhead .appname{max-width:420px}
.bstat{font-size:14px;color:var(--ink-2)}
.bstat b{color:var(--ink)}
.build{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.build>section{min-width:0}
.sectlab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.rules{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.rules ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.rules li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rules li:first-child{border-top:0}
.rules .rname{font-weight:700;font-size:14.5px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rules .rtext{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.rules .rtext .ex{color:var(--ink-3);font-style:italic}
.exports{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.filetabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.ftab{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.ftab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;font:12.5px var(--mono);color:var(--ink-3);margin-bottom:8px}
.code{font:12px/1.55 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:430px;overflow:auto;white-space:pre;margin:0;color:var(--ink);tab-size:2}
.saves{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.savenote{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.empty-pane{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center}
.empty-pane p{color:var(--ink-2);margin:8px auto 18px;max-width:46ch}

/* Toolchain strip */
.eco{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.eco-item{display:inline-flex;align-items:baseline;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;color:var(--ink-2);text-decoration:none;background:var(--surface)}
.eco-item b{color:var(--ink)}
a.eco-item:hover{border-color:var(--ink-3)}
.eco-item.here{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.eco-arrow{color:var(--ink-3);align-self:center;font-size:13px}

/* Ways in */
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.way{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.way:hover{border-color:var(--ink-3)}
.way[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.way-l{font:700 16px/1.25 var(--display)}
.way-d{font-size:13.5px;color:var(--ink-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px dashed var(--line);border-radius:12px;padding:22px;margin:16px 0}
.drop.over{border-color:var(--rec);background:var(--rec-soft)}
.drop span{color:var(--ink-2);font-size:14.5px}
.mode{border:0;padding:0;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px 18px}
.mode legend{padding:0;margin-bottom:6px}
.mode label{display:inline-flex;gap:7px;align-items:center;font-size:14.5px}
.mode input{accent-color:var(--rec)}
.status.err{color:var(--crit)}
.callout{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--sunk);font-size:14.5px}
.callout p{margin:4px 0 0;color:var(--ink-2)}
.handoff{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:h}
.handoff li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;counter-increment:h}
.handoff li::before{content:counter(h);font:600 13px var(--mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.handoff p{margin:2px 0 8px;color:var(--ink-2);font-size:14.5px}
.handoff .row{margin-top:0}

/* Origin and provenance */
.origin p{margin:6px 0 0}
.prov{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--rec);background:var(--rec-soft);border-radius:0 8px 8px 0;font-size:14.5px}
.prov cite{display:block;margin-top:4px;font:normal 12px var(--mono);color:var(--ink-2);overflow-wrap:anywhere}
code{font-family:var(--mono);font-size:.88em;overflow-wrap:anywhere}

/* Findings */
.fsec{margin-top:30px}
.sev-info .card-head{background:var(--sunk)} .sev-info .sev{color:var(--ink-2)}
.verdict{font:600 11px/1 var(--mono);padding:4px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.verdict.fail{background:var(--crit);color:#fff}
.verdict.undetermined{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}
.verdict.pass{background:var(--good-soft);color:var(--good)}
.card.reviewed{opacity:.6}
.termlinks{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
details.axioms summary{cursor:pointer;font-size:13.5px;font-weight:700}
details.axioms pre{font:12px/1.5 var(--mono);background:var(--sunk);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0 0;white-space:pre-wrap}

/* Next in the toolchain */
.next{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;align-items:center}
.nextrow>div:first-child{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.nextrow span{font-size:13.5px;color:var(--ink-2)}
.nb{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none}
.bfields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;max-width:760px}

/* Generated-tool preview: runtime tokens mapped onto the page's tokens */
.kwr{--r-bg:var(--surface);--r-sunk:var(--sunk);--r-ink:var(--ink);--r-ink2:var(--ink-2);--r-line:var(--line);--r-accent:var(--accent);--r-accent-ink:var(--accent-ink);--r-focus:var(--focus);

<script>
/* ===== Generated-tool runtime. Self-contained: it is copied verbatim into every exported tracker. ===== */
function KindworkRuntime(root, schema, opts) {
  opts = opts || {};
  var data = {};
  try { data = (opts.load && opts.load()) || {}; } catch (e) { data = {}; }
  var cols = schema.collections;
  var cur = cols.length ? cols[0].id : null;
  var mode = null, editId = null, errs = [], confirmId = null, draft = null;
  var FAM = { things: 'Things and their features', records: 'Records and recognition', time: 'Happenings and time' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function col(id) { for (var i = 0; i < cols.length; i++) if (cols[i].id === id) return cols[i]; return null; }
  function rows(id) { if (!data[id]) data[id] = []; return data[id]; }
  function persist() { if (opts.save) { try { opts.save(data); } catch (e) {} } }
  function nameOf(cid, rid) { var r = rows(cid).filter(function (x) { return x.id === rid; })[0]; return r ? r.name : '(removed)'; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nowISO() { var d = new Date(); return today() + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function state(c, r) {
    var t = today(), n = nowISO();
    if (c.state === 'status') { if (r.standing === 'Revoked') return ['Revoked', 'crit']; if (r.standing === 'Suspended') return ['Suspended', 'warn']; if (r.expires && r.expires < t) return ['Expired', 'crit']; return ['In force', 'good']; }
    if (c.state === 'obligation') { if (r.standing === 'Met') return ['Met', 'good']; if (r.standing === 'Waived') return ['Waived', 'muted']; if (r.due && r.due < t) return ['Overdue', 'crit']; return ['Open', 'warn']; }
    if (c.state === 'happening') { if (r.start && r.start > n) return ['Scheduled', 'muted']; if (!r.end) return ['In progress', 'warn']; return ['Finished', 'good']; }
    if (c.state === 'period') { if (r.starts && r.starts > t) return ['Upcoming', 'muted']; if (r.ends && r.ends < t) return ['Past', 'muted']; return ['Current', 'good']; }
    if (c.state === 'role') { if (r.until && r.until < t) return ['Ended', 'muted']; return ['Current', 'good']; }
    return null;
  }
  function none() { return '<span class="kwr-dim">none</span>'; }
  function display(f, r) {
    var v = r[f.key];
    if (f.type === 'ref') return v ? esc(nameOf(f.ref, v)) : none();
    if (f.type === 'refs') return (v && v.length) ? esc(v.map(function (x) { return nameOf(f.ref, x); }).join(', ')) : none();
    if (f.type === 'datetime' && v) return esc(String(v).replace('T', ' '));
    return (v == null || v === '') ? none() : esc(v);

  function validate(c, r) {
    var e = [];
    c.fields.forEach(function (f) { var v = r[f.key]; if (f.req && (v == null || v === '' || (Array.isArray(v) && !v.length))) e.push(f.label + ' is needed for every ' + c.name + '.'); });
    (c.rules || []).forEach(function (ru) {
      if (ru.type === 'order' && r[ru.a] && r[ru.b] && r[ru.b] < r[ru.a]) e.push(ru.msg);
      if (ru.type === 'unique' && r[ru.key] && rows(c.id).some(function (x) { return x.id !== r.id && x[ru.key] === r[ru.key]; })) e.push(ru.msg);
    });

  }
  function field(c, f, r) {
    var v = r[f.key], id = 'kwr-' + c.id + '-' + f.key, req = f.req ? ' <span class="kwr-req">required</span>' : '';
    var lab = '<label for="' + id + '">' + esc(f.label) + req + '</label>';
    if (f.type === 'textarea') return '<div class="kwr-f kwr-wide">' + lab + '<textarea id="' + id + '" data-f="' + f.key + '" rows="2">' + esc(v) + '</textarea></div>';
    if (f.type === 'select') return '<div class="kwr-f">' + lab + '<select id="' + id + '" data-f="' + f.key + '">' + f.options.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
    if (f.type === 'ref') {
      var list = rows(f.ref), tc = col(f.ref);
      return '<div class="kwr-f">' + lab + '<select id="' + id + '" data-f="' + f.key + '"><option value="">Choose…</option>' + list.map(function (o) { return '<option value="' + o.id + '"' + (o.id === v ? ' selected' : '') + '>' + esc(o.name) + '</option>'; }).join('') + '</select>' + (list.length ? '' : '<span class="kwr-help">No ' + esc(tc ? tc.name : 'entries') + ' entries yet. Add one there first.</span>') + '</div>';
    }
    if (f.type === 'refs') {
      var l2 = rows(f.ref), tc2 = col(f.ref); v = v || [];
      return '<fieldset class="kwr-f kwr-wide"><legend>' + esc(f.label) + req + '</legend>' + (l2.length ? '<div class="kwr-checks">' + l2.map(function (o) { return '<label class="kwr-check"><input type="checkbox" data-fm="' + f.key + '" value="' + o.id + '"' + (v.indexOf(o.id) >= 0 ? ' checked' : '') + '> ' + esc(o.name) + '</label>'; }).join('') + '</div>' : '<span class="kwr-help">No ' + esc(tc2 ? tc2.name : 'entries') + ' entries yet.</span>') + '</fieldset>';
    }
    var type = f.type === 'datetime' ? 'datetime-local' : (f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text'));
    return '<div class="kwr-f">' + lab + '<input id="' + id + '" type="' + type + '" data-f="' + f.key + '" value="' + esc(v) + '"' + (type === 'number' ? ' step="any"' : '') + '></div>';
  }
  function render() {
    var c = col(cur);
    var nav = ['things', 'records', 'time'].map(function (fam) {
      var cs = cols.filter(function (x) { return x.fam === fam; });

    }).join('');
    var main = '';
    if (!c) main = '<div class="kwr-empty">This tool has no record types yet.</div>';
    else {
      var list = rows(c.id);
      var shown = c.fields.filter(function (f) { return f.key !== 'name' && f.type !== 'textarea'; }).slice(0, 3);
      main += '<div class="kwr-colhead"><div><div class="kwr-kind">' + esc(c.kw) + '</div><h2>' + esc(c.name) + '</h2><p>' + esc(c.meaning) + '</p></div>' + (mode ? '' : '<button type="button" class="kwr-btn kwr-primary" data-k="add">Add ' + esc(c.name) + '</button>') + '</div>';
      (c.notes || []).forEach(function (n) { main += '<div class="kwr-note">' + esc(n) + '</div>'; });
      if (mode) {
        var r = draft || (editId ? (list.filter(function (x) { return x.id === editId; })[0] || {}) : {});
        if (!editId && !draft) c.fields.forEach(function (f) { if (f.type === 'select' && r[f.key] == null) r[f.key] = f.options[0]; });
        main += '<form class="kwr-form" data-k="form" novalidate><div class="kwr-formhead">' + (editId ? 'Edit ' : 'New ') + esc(c.name) + '</div><div class="kwr-grid">' + c.fields.map(function (f) { return field(c, f, r); }).join('') + '</div>' + (errs.length ? '<ul class="kwr-errs" role="alert">' + errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') + '<div class="kwr-actions"><button type="submit" class="kwr-btn kwr-primary">Save</button><button type="button" class="kwr-btn" data-k="cancel">Cancel</button></div></form>';
      }
      if (!list.length) main += '<div class="kwr-empty">No ' + esc(c.name) + ' entries yet. Use “Add ' + esc(c.name) + '” to record the first one.</div>';
      else main += '<div class="kwr-tablewrap"><table class="kwr-table"><thead><tr><th>' + esc(c.fields[0].label) + '</th>' + shown.map(function (f) { return '<th>' + esc(f.label) + '</th>'; }).join('') + (c.state ? '<th>State</th>' : '') + '<th><span class="kwr-sr">Actions</span></th></tr></thead><tbody>' + list.map(function (r) {
        var st = state(c, r), bad = validate(c, r).length;
        return '<tr><td><b>' + esc(r.name) + '</b>' + (bad ? ' <span class="kwr-pill crit" title="This entry breaks a rule; open it to see which">Check</span>' : '') + '</td>' + shown.map(function (f) { return '<td>' + display(f, r) + '</td>'; }).join('') + (c.state ? '<td>' + (st ? '<span class="kwr-pill ' + st[1] + '">' + st[0] + '</span>' : '') + '</td>' : '') + '<td class="kwr-rowact"><button type="button" class="kwr-link" data-k="edit" data-id="' + r.id + '">Edit</button>' + (confirmId === r.id ? '<button type="button" class="kwr-link kwr-danger" data-k="del" data-id="' + r.id + '">Confirm delete</button>' : '<button type="button" class="kwr-link" data-k="askdel" data-id="' + r.id + '">Delete</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    root.innerHTML = '<div class="kwr-app"><header class="kwr-head"><div><div class="kwr-eyebrow">Tracker</div><div class="kwr-title">' + esc(schema.app) + '</div></div><div class="kwr-meta">' + cols.length + ' record types · rules from a checked model' + (opts.exportData ? ' · <button type="button" class="kwr-link" data-k="export">Export data</button>' : '') + '</div></header><div class="kwr-body"><nav class="kwr-nav" aria-label="Record types">' + nav + '</nav><section class="kwr-main">' + main + '</section></div></div>';
  }
  root.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-k]'); if (!b || !root.contains(b)) return;
    var k = b.getAttribute('data-k'), id = b.getAttribute('data-id');
    if (k === 'nav') { cur = id; mode = null; editId = null; errs = []; confirmId = null; draft = null; render(); }
    else if (k === 'add') { mode = 'new'; editId = null; errs = []; draft = null; render(); var first = root.querySelector('.kwr-form input,.kwr-form select'); if (first) first.focus(); }

  root.addEventListener('submit', function (ev) {
    var form = ev.target.closest('[data-k="form"]'); if (!form) return;

    var base = editId ? (list.filter(function (x) { return x.id === editId; })[0] || {}) : {};

    mode = null; editId = null; draft = null; persist(); render();
  });
  render();
}

const KW = {

  authority:  { fam: 'things',  rec: true, bfo: 'role, authority pattern', iri: 'BFO:0000023', parent: 'obo:BFO_0000023', plain: 'The standing to grant, revoke, or recognize a status.' },
  record:     { fam: 'records', bfo: 'information content entity', iri: 'IAO:0000030', parent: 'obo:IAO_0000030', plain: 'Written or recorded information about something else.' },

  status:     { fam: 'records', rec: true, bfo: 'generically dependent continuant, recognition pattern', iri: 'BFO:0000031', parent: 'obo:BFO_0000031', plain: 'Exists because an authority granted it, and can be revoked.' },

async function handleFile(file) {
  if (!file) return;
  IMP = { msg: `Reading ${file.name}…`, err: false }; render();
  try {
    const text = await file.text(), head = text.trimStart().slice(0, 4000);
    if (head.startsWith('{')) {
      const j = JSON.parse(text);
      if (j.format === 'owltester-findings') {
        applyFindings(j); const n = openFindings().length;
        IMP = { msg: `Imported ${S.findings.length} OwlTester findings; ${n} need attention.`, err: false }; S.tab = 'resolve';
      } else if (j.format === 'kindwork-model') {
        applyManifest(j); IMP = { msg: `Opened the Kindwork model ${S.appName}, ${S.terms.length} terms.`, err: false }; S.tab = 'interview';
      } else throw new Error("That JSON isn't a Kindwork model or an OwlTester findings file.");
    } else if (/^\s*(Prefix|Ontology)\s*\(/m.test(head) && !head.startsWith('<')) {
      throw new Error('This looks like OWL functional syntax. Save it as Turtle or RDF/XML (in Protégé: File, Save as) and try again.');
    } else {
      const T = head.startsWith('<') ? parseRdfXml(text) : parseTurtle(text);
      const res = importTriples(T);
      applyImport(res, S.impMode, file.name);
      const placed = res.terms.filter(t => walk(t.a).kw).length, clash = res.terms.filter(t => t.imp.clash).length, ask = res.terms.length - placed - clash;
      IMP = { msg: `Imported ${res.terms.length} classes from ${file.name}${res.total > res.terms.length ? ` (the ${res.terms.length} closest to BFO, of ${res.total})` : ''}. ${placed} placed by their BFO category, ${ask} need answers${clash ? `, ${clash} filed under conflicting categories` : ''}.`, err: false };
      S.tab = clash ? 'resolve' : 'interview';
    }
  } catch (e) {
    IMP = { msg: (e && e.message && !/^Unexpected|JSON/.test(e.message)) ? e.message : "That file couldn't be read. Kindwork reads Turtle, RDF/XML, Kindwork models, and OwlTester findings.", err: true };
  }

}

"""

"""

r1: Does it happen, or is it a stretch or point of time?  y -> a1, n -> r2
a1: Is it the time itself, not something going on during it?  y = period; n -> a2
a2: Does it take any time at all?  y = happening; n = moment
r2: Does it exist because something was written, declared, or decided?  y -> b1, n -> c1
b1: Is it a name, code, or label for something else?  y = code; n -> b2
b2: Does it bind someone to do something, for someone who can claim it?  y = obligation; n -> b3
b3: Was it granted or recognized by someone with authority, who could revoke it?  y = status; n = record
c1: Is it a place things can be in?  y = place; n -> c2
c2: Is it several things counted as one, with members that come and go (a crew, a board, a company)?  y = group; n -> c3
c3: Could you touch it or weigh it (a person, a machine)?  y = thing; n -> c4
c4: Is it always there and measurable right now, on one particular thing?  y = quality; n -> c5
c5: Could it be gained or lost with no physical change to whoever has it?  y -> c5b; n -> c6
c5b: Can whoever holds it grant, revoke, or recognize a status?  y = authority; n = role
c6: Was the thing that has it designed or made to do this?  y = function; n = tendency

  (Array.isArray(res.relations) ? res.relations : []).forEach(r => {
    const f = byName.get(String(r && r.from || '').toLowerCase()), t = byName.get(String(r && r.to || '').toLowerCase());
    if (f && t && f !== t && RELNAMES.includes(r.rel) && !rels.some(x => x.f === f && x.r === r.rel && x.t === t)) rels.push({ f, r: r.rel, t });
  });
  S.terms = terms; S.rels = rels; S.appName = String(res.appName || 'Tracker').slice(0, 60); S.sel = terms[0].id;
  previewData = {};
}
function sampleMessage(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') return "Claude isn't available to this page. You can still add terms by hand below.";
  if (c === 'rate_limited') return 'Too many requests just now. Try again in a minute.';
  if (c === 'session_expired') return 'Your session expired. Sign in again, then try once more.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'The answer came back in the wrong shape. Try again, or shorten the description.';
  if (c === 'prompt_too_large') return 'The description is too long. Trim it to a few paragraphs.';
  if (c === 'refused') return "Claude declined this description. Reword it and try again.";
  return 'Something went wrong reaching Claude. Try again.';
}
let ctl = null;
async function extract() {
  const task = (S.task || '').trim();
  if (!sample) { X = { busy: false, msg: "Finding terms needs Claude, which isn't available in this view. Add terms by hand below." }; render(); return; }
  if (task.length < 40) { X = { busy: false, msg: 'Write a few sentences about the task first.' }; render(); return; }
  ctl = new AbortController();
  X = { busy: true, msg: 'Reading the task and asking the questions for each term. This usually takes 20 to 60 seconds.' }; render();
  try {
    const res = await sample.json(extractionPrompt(task), { modelTier: 'default', signal: ctl.signal });
    applyExtraction(res);
    X = { busy: false, msg: `Found ${S.terms.length} terms. Check each one in the interview.` };
    S.tab = 'interview';
  } catch (e) {
    X = { busy: false, msg: e && e.code === 'cancelled' ? 'Stopped.' : sampleMessage(e) };
  }
  ctl = null; commit();
}

          ${downloads ? `<button type="button" class="btn primary" data-act="savekit"${window.JSZip ? '' : ' hidden'}>Download the kit (.zip)</button><button type="button" class="btn" data-act="savetracker">Save the tracker (.html)</button>` : ''}
        </div>
        <p class="savenote" id="savenote" role="status">${downloads ? 'The kit holds the tracker, the ontology, the rules, the keyword source, the model file, and a README.' : "Saving files isn't available in this view. Copy each file instead."}</p>
        <div class="next">
          <div class="eyebrow">Next in the toolchain</div>
          <div class="nextrow"><div><b>Verify in OwlTester</b><span>A DL reasoner checks consistency, coherence, and entailment.</span></div><div class="nb">${downloads && window.JSZip ? `<button type="button" class="btn" data-act="savetester">Save for OwlTester</button>` : ''}<a class="btn ghost" href="${ECO.tester}" target="_blank" rel="noopener">Open</a></div></div>
          <div class="nextrow"><div><b>Populate from documents</b><span>BFO-Agent fills these kinds from your text, with sources.</span></div><div class="nb">${downloads ? `<button type="button" class="btn" data-act="saveseed">Save the seed</button>` : `<button type="button" class="btn" data-act="copyseed">Copy the seed</button>`}<a class="btn ghost" href="${ECO.agent}" target="_blank" rel="noopener">Open</a></div></div>
          <div class="nextrow"><div><b>Bring results back</b><span>OwlTester findings become cards; BFO-Agent classes merge in.</span></div><div class="nb"><button type="button" class="btn primary" data-act="way" data-way="import">Import</button></div></div>
        </div>
      </section>
    </div>`;
}

let fileCache = {};
function renderFileBody() {
  const host = document.getElementById('filebody'); if (!host) return;
  const sch = genSchema(), f = FILES.find(x => x.k === fileTab);
  const text = f.gen(sch); fileCache[f.k] = text;
  host.innerHTML = `<div class="fmeta"><span>${esc(sch.slug + f.ext)} · ${text.split('\n').length} lines</span><button type="button" class="link" data-act="copy">Copy</button></div><pre class="code" tabindex="0" aria-label="${esc(f.label)}">${esc(text)}</pre><p class="savenote">${esc(f.note)}</p>`;
  document.querySelectorAll('.ftab').forEach(b => b.setAttribute('aria-selected', b.getAttribute('data-k') === fileTab));
}

function mountPreview() {
  const host = document.getElementById('preview'); if (!host) return;
  const sch = genSchema();
  const ids = new Set(sch.collections.map(c => c.id));
  Object.keys(previewData).forEach(k => { if (!ids.has(k)) delete previewData[k]; });
  KindworkRuntime(host, sch, { load: () => previewData, save: d => { previewData = d; } });
}

function render() {
  const conf = findConflicts();
  ontEl.checked = !!S.ont;
  renderSteps(conf);
  if (S.tab === 'describe') view.innerHTML = renderDescribe();
  else if (S.tab === 'resolve') view.innerHTML = renderResolve(conf);
  else if (S.tab === 'build') { view.innerHTML = renderBuild(conf); mountPreview(); renderFileBody(); }
  else { S.tab = 'interview'; view.innerHTML = renderInterview(conf); }
}

/* ---------- Events ---------- */
async function save(filename, data, note) {
  const el = document.getElementById('savenote');
  try { await downloads.save({ filename, data }); if (el) el.textContent = `Saved ${filename}.`; }
  catch (e) {
    const c = e && e.code;
    if (el) el.textContent = c === 'declined' ? 'Not saved.' : c === 'rate_limited' ? 'A save is already waiting for your answer.' : "Saving didn't work in this view. Copy the files instead.";
  }
}
async function saveKit() {
  const sch = genSchema(), zip = new JSZip(), dir = zip.folder(sch.slug);
  dir.file(sch.slug + '.html', genTracker(sch));
  dir.file(sch.slug + '.ttl', genOWL(sch));
  dir.file(sch.slug + '-shapes.ttl', genSHACL(sch));
  dir.file(sch.slug + '.kw', genKW(sch));
  dir.file(sch.slug + '.kindwork.json', genManifest(sch));
  dir.file('README.md', genReadme(sch) + genReadmeTail(sch));
  const blob = await zip.generateAsync({ type: 'blob' });
  await save(sch.slug + '-kit.zip', blob);
}
async function saveForTester() {
  const sch = genSchema(), zip = new JSZip();
  zip.file(sch.slug + '.ttl', genOWL(sch));
  zip.file(sch.slug + '-shapes.ttl', genSHACL(sch));
  zip.file(sch.slug + '.kindwork.json', genManifest(sch));
  const blob = await zip.generateAsync({ type: 'blob' });
  await save(sch.slug + '-for-owltester.zip', blob);
}
function saveSeed() { const sch = genSchema(); return save(sch.slug + '.kindwork.json', genManifest(sch)); }

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.getAttribute('data-act');
  const t = termById(S.sel);
  switch (act) {
    case 'tab': S.tab = b.getAttribute('data-tab'); confirmDel = null; commit(); window.scrollTo({ top: 0 }); break;
    case 'sel': S.sel = b.getAttribute('data-id'); confirmDel = null; commit(); break;
    case 'goterm': S.sel = b.getAttribute('data-id'); S.tab = 'interview'; commit(); window.scrollTo({ top: 0 }); break;
    case 'ans': if (t) { const q = b.getAttribute('data-q'), v = b.getAttribute('data-v'); t.a[q] = t.a[q] === v ? undefined : v; if (t.a[q] === undefined) delete t.a[q]; commit(); } break;
    case 'askdel': confirmDel = b.getAttribute('data-id'); render(); break;
    case 'canceldel': confirmDel = null; render(); break;
    case 'delterm': { const id = b.getAttribute('data-id'); S.terms = S.terms.filter(x => x.id !== id); S.rels = S.rels.filter(x => x.f !== id && x.t !== id); confirmDel = null; S.sel = S.terms[0] ? S.terms[0].id : null; delete previewData[id]; commit(); break; }
    case 'extract': extract(); break;
    case 'stop': if (ctl) ctl.abort(); break;
    case 'example': { const ex = exampleModel(); Object.assign(S, ex, { findings: [], findingsMeta: null, ns: '' }); previewData = {}; X = { busy: false, msg: 'Example loaded: 14 terms, three things to resolve.' }; commit(); break; }
    case 'opt': { const c = findConflicts().find(x => x.id === b.getAttribute('data-c')); const o = c && c.opts[+b.getAttribute('data-i')]; if (o) { o.a(); commit(); } break; }
    case 'file': fileTab = b.getAttribute('data-k'); renderFileBody(); break;
    case 'copy': {
      const text = fileCache[fileTab] || '';
      const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1600); };
      const fallback = () => { const pre = document.querySelector('#filebody pre'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = 'Selected: press copy'; } };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
      break;
    }
    case 'savetracker': { const sch = genSchema(); save(sch.slug + '.html', genTracker(sch)); break; }
    case 'savekit': saveKit(); break;
    case 'savetester': saveForTester(); break;
    case 'saveseed': saveSeed(); break;
    case 'copyseed': {
      const text = genManifest(genSchema()), note = document.getElementById('savenote');
      const ok = () => { if (note) note.textContent = 'Seed copied. Paste it into BFO-Agent, or save it as a .json file.'; };
      const no = () => { if (note) note.textContent = "Copying didn't work here. In Build, open the Model (JSON) file and copy it from there."; };
      try { navigator.clipboard.writeText(text).then(ok, no); } catch (e) { no(); }
      break;
    }
    case 'way': S.way = b.getAttribute('data-way'); if (b.getAttribute('data-mode')) S.impMode = b.getAttribute('data-mode'); S.tab = 'describe'; IMP = { msg: '', err: false }; commit(); window.scrollTo({ top: 0 }); break;
    case 'review': { const f = (S.findings || []).find(x => x.id === b.getAttribute('data-f')); if (f) { f.reviewed = !f.reviewed; commit(); } break; }
    case 'clearfindings': S.findings = []; S.findingsMeta = null; commit(); break;
  }
});
document.addEventListener('dragover', ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (!z) return; ev.preventDefault(); z.classList.add('over'); });
document.addEventListener('dragleave', ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (!z) return; ev.preventDefault(); z.classList.remove('over'); const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) handleFile(f); });
document.addEventListener('submit', ev => {
  const form = ev.target.closest('form[data-form]'); if (!form) return;
  ev.preventDefault();
  const kind = form.getAttribute('data-form'), input = form.querySelector('input'), v = input ? input.value.trim() : '';
  if (!v) { if (input) input.focus(); return; }
  if (kind === 'addterm') { const n = addTerm(v, null, ''); S.sel = n.id; S.tab = 'interview'; commit(); }
  if (kind === 'opt') { const c = findConflicts().find(x => x.id === form.getAttribute('data-c')); const o = c && c.opts[+form.getAttribute('data-i')]; if (o) { o.a(v); commit(); } }
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.getAttribute && el.getAttribute('data-in'); if (!k) return;
  const t = termById(S.sel);
  if (k === 'task') S.task = el.value;
  else if (k === 'appname') S.appName = el.value;
  else if (k === 'ns') S.ns = el.value;
  else if (k === 'tname' && t) { t.name = el.value; const li = document.querySelector(`.titem[data-id="${t.id}"] .tname`); if (li) li.textContent = el.value || 'Untitled'; }
  else if (k === 'tdesc' && t) t.desc = el.value;
  saveDraft();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el === ontEl) { S.ont = el.checked; commit(); return; }
  if (el.id === 'impfile') { const f = el.files && el.files[0]; el.value = ''; handleFile(f); return; }
  if (el.name === 'impmode') { S.impMode = el.value; saveDraft(); return; }
  if (el.getAttribute && el.getAttribute('data-in') === 'ns') { commit(); return; }
  const k = el.getAttribute && el.getAttribute('data-ch');
  const di = el.getAttribute && el.getAttribute('data-in');
  if (di === 'appname') { commit(); return; }
  if (di === 'tname') { const t = termById(S.sel); if (t && !t.name.trim()) t.name = 'Untitled'; commit(); return; }
  if (!k) return;
  const t = termById(S.sel); if (!t) return;
  if (k === 'sig') { t.sig[el.getAttribute('data-k')] = el.checked; if (!el.checked) delete t.sig[el.getAttribute('data-k')]; }
  else if (k === 'rel') setRel(t.id, el.getAttribute('data-r'), el.value || null);
  else if (k === 'relm') toggleRel(t.id, el.getAttribute('data-r'), el.value, el.checked);
  commit();
});

render();
/* Hook for the Kindwork build service, which runs this same code server-side. Inert in the browser. */
if (window.__KINDWORK_EXPORT__) window.__KINDWORK_EXPORT__({ S, walk, kwOf, findConflicts, genSchema, genOWL, genSHACL, genKW, genManifest, genTracker, genReadme, genReadmeTail, parseTurtle, parseRdfXml, importTriples, applyImport, applyManifest, applyFindings, openFindings, iriOf, localNames, nsBase, termById, relsOf, KW, PATHS, Q, SLOTS, RELNAMES, BFO, KWV });
})();
