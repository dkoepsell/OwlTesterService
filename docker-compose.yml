services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owltester}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-owl_tester}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owltester} -d ${POSTGRES_DB:-owl_tester}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared rate-limit counters for all gunicorn workers (Flask-Limiter).
  # Ephemeral by design: no persistence, small memory cap.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Kindwork module (kindwork_core/docs/SPEC-OWLTESTER-KINDWORK-MODULE.md)
      KINDWORK_MODE: ${KINDWORK_MODE:-triage}
      KINDWORK_LLM_MODEL: ${KINDWORK_LLM_MODEL:-}
      KINDWORK_TOKEN: ${KINDWORK_TOKEN:-}
      KINDWORK_REASONER_TIMEOUT_MS: ${KINDWORK_REASONER_TIMEOUT_MS:-60000}
      KINDWORK_CTA_TITLE: ${KINDWORK_CTA_TITLE:-}
      KINDWORK_CTA_TEXT: ${KINDWORK_CTA_TEXT:-}
      KINDWORK_CTA_HREF: ${KINDWORK_CTA_HREF:-}
      KINDWORK_CTA_LABEL: ${KINDWORK_CTA_LABEL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-owltester}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-owl_tester}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      # Full artifact audit and guided release repair (SPEC-audit.md, SPEC-audit-repair.md).
      # Both lists empty mean nobody may audit or repair; set both to the owner's account.
      AUDIT_ALLOWED_USERS: ${AUDIT_ALLOWED_USERS:-}
      REPAIR_ALLOWED_USERS: ${REPAIR_ALLOWED_USERS:-}
      REPAIR_RETENTION_DAYS: ${REPAIR_RETENTION_DAYS:-90}
      REPAIR_MAX_REMOVED: ${REPAIR_MAX_REMOVED:-0.02}
      # Release builder (SPEC-release.md, Part B): empty means nobody may build.
      BUILD_ALLOWED_USERS: ${BUILD_ALLOWED_USERS:-}
      # Site admins (grant power users at /admin/power-users); empty means none.
      ADMIN_USERS: ${ADMIN_USERS:-}
      SERVER_AI_KEY_FOR: ${SERVER_AI_KEY_FOR:-power}
      POWER_UPLOAD_LIMIT: ${POWER_UPLOAD_LIMIT:-}
      POWER_ANALYSIS_LIMIT: ${POWER_ANALYSIS_LIMIT:-}
      POWER_AI_LIMIT: ${POWER_AI_LIMIT:-}
      BUILD_BUDGET: ${BUILD_BUDGET:-300}
    volumes:
      - uploads:/app/uploads
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

volumes:
  postgres_data:
  uploads:
  certbot_www:
  certbot_certs:
