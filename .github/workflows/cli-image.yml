# Build and publish the OwlTester CLI image (SPEC-release.md, section 3) on each tag.
name: cli-image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          push: true
          build-args: OWLTESTER_VERSION=${{ steps.meta.outputs.short }}
          tags: |
            ghcr.io/dkoepsell/owltester-cli:${{ steps.meta.outputs.ref }}
            ghcr.io/dkoepsell/owltester-cli:${{ steps.meta.outputs.short }}
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## OwlTester CLI image"
            echo
            echo "Pin it in action/IMAGE:"
            echo
            echo "    ghcr.io/dkoepsell/owltester-cli@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
